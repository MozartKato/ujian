<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - CBT System</title>
  <link rel="stylesheet" href="./styles/main.css">
  <link rel="stylesheet" href="./styles/auth.css">
</head>
<body>
  <div id="app" x-data="authStore()" x-init="init()">
    
    <!-- Navbar -->
    <nav class="navbar">
      <div class="nav-container">
        <a href="/" class="nav-logo">🎓 CBT System</a>
        <div class="nav-menu">
          <a href="/" class="nav-link">Home</a>
          <a href="/login.html" class="nav-link">Login</a>
        </div>
      </div>
    </nav>

    <!-- Register Form -->
    <div class="auth-container">
      <div class="auth-card">
        <h1>📝 Register</h1>
        <p class="auth-subtitle">Buat akun untuk mulai mengikuti ujian</p>

        <form @submit.prevent="handleRegister" class="auth-form">
          <div class="form-group">
            <label>Nama Lengkap:</label>
            <input 
              type="text" 
              x-model="formData.name" 
              required 
              placeholder="John Doe"
              autocomplete="name"
            >
          </div>

          <div class="form-group">
            <label>Username:</label>
            <input 
              type="text" 
              x-model="formData.user_name" 
              required 
              placeholder="johndoe"
              autocomplete="username"
              pattern="[a-zA-Z0-9_]+"
              title="Username hanya boleh huruf, angka, dan underscore"
            >
          </div>

          <div class="form-group">
            <label>Email:</label>
            <input 
              type="email" 
              x-model="formData.email" 
              required 
              placeholder="your@email.com"
              autocomplete="email"
            >
          </div>

          <div class="form-group">
            <label>Password:</label>
            <input 
              type="password" 
              x-model="formData.password" 
              required 
              placeholder="••••••••"
              autocomplete="new-password"
              minlength="6"
            >
            <small>Minimal 6 karakter</small>
          </div>

          <div class="form-group">
            <label>Konfirmasi Password:</label>
            <input 
              type="password" 
              x-model="formData.confirmPassword" 
              required 
              placeholder="••••••••"
              autocomplete="new-password"
              minlength="6"
            >
          </div>

          <div x-show="error" class="error-message" x-text="error"></div>

          <button type="submit" class="btn-primary" :disabled="loading">
            <span x-show="!loading">Register</span>
            <span x-show="loading">Loading...</span>
          </button>
        </form>

        <div class="auth-footer">
          <p>Sudah punya akun? <a href="/login.html">Login di sini</a></p>
        </div>
      </div>
    </div>

  </div>

  <script type="module">
    import Alpine from 'alpinejs';
    import ApiService from './js/services/api.service.js';
    
    window.Alpine = Alpine;
    
    Alpine.data('authStore', () => ({
        formData: {
          name: '',
          user_name: '',
          email: '',
          password: '',
          confirmPassword: ''
        },
        loading: false,
        error: '',

        async init() {
          // Check if already logged in
          try {
            await ApiService.getCurrentUser();
            window.location.href = '/';
          } catch (error) {
            // Not logged in, stay on register page
          }
        },

        async handleRegister() {
          this.loading = true;
          this.error = '';

          // Validate passwords match
          if (this.formData.password !== this.formData.confirmPassword) {
            this.error = 'Password dan konfirmasi password tidak cocok';
            this.loading = false;
            return;
          }

          try {
            const { confirmPassword, ...registerData } = this.formData;
            const response = await ApiService.register(registerData);
            
            if (response.user) {
              window.location.href = '/';
            }
          } catch (error) {
            this.error = error.message || 'Registrasi gagal. Silakan coba lagi.';
          } finally {
            this.loading = false;
          }
        }
      }));
    
    Alpine.start();
  </script>
</body>
</html>
